name: Verify candidate archive

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify parts, ZIP, JSON files and manifest
        run: python scripts/verify_release_archive.py
